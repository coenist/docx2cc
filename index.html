<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>DOCX naar IMS Common Cartridge 1.3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.min.js"></script>

  <script>
    window.MathJax = {
      startup: { typeset: false },
      svg: { fontCache: "none" }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js"></script>
</head>

<body>
  <h1>DOCX naar IMS Common Cartridge 1.3</h1>

  <p>
    Deze versie werkt volledig in de browser. Het DOCX-bestand wordt niet geüpload.
  </p>

  <div class="toolbar">
    <input id="docxInput" type="file" accept=".docx" />
    <button id="processBtn" class="primary">Verwerk DOCX</button>
    <button id="downloadBtn" disabled>Maak ZIP en download</button>
  </div>

  <p id="status" class="status"></p>
  <div id="warningBox" class="warning" hidden></div>
  <div id="log" class="log"></div>

  <main>
    <section class="panel">
      <h2>Hoofdstukken</h2>
      <div id="chapters"></div>
    </section>

    <section class="panel">
      <h2>Preview</h2>
      <div id="preview" class="preview"></div>

      <h3>Afbeeldingen in dit hoofdstuk</h3>
      <div id="images" class="images"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
